name: Silicluster SKY130 Physical Check

on:
  workflow_dispatch:

jobs:
  physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PDK_ROOT: ${{ github.workspace }}/pdks
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check configuration and RTL
        run: |
          python3 -m json.tool physical/config.json >/dev/null
          test -s silicluster_emg_core.v
          test -s silicluster_emg_top.v
          echo 'Configuration and RTL files found.'

      - name: Install LibreLane and Volare
        run: |
          python3 -m pip install --upgrade --break-system-packages librelane volare pyyaml
          librelane --version
          volare --help | head -35

      - name: Resolve official SKY130 PDK revision
        shell: bash
        run: |
          set -euo pipefail
          # A working tree installed from PyPI does not contain tool_metadata.yml.
          # Retrieve the matching open_pdks revision from LibreLane's public metadata.
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/efabless/librelane/main/dependencies/tool_metadata.yml \
            --output /tmp/librelane_tool_metadata.yml
          python3 - <<'PY'
          import os
          import re
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('/tmp/librelane_tool_metadata.yml').read_text())
          item = data.get('open_pdks') if isinstance(data, dict) else None
          if isinstance(item, dict):
              item = item.get('commit') or item.get('rev') or item.get('revision')
          if not isinstance(item, str) or not re.fullmatch(r'[0-9a-fA-F]{7,40}', item):
              raise SystemExit('Cannot read open_pdks commit from LibreLane metadata; inspect /tmp/librelane_tool_metadata.yml structure.')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('OPEN_PDKS_REV=' + item + '\n')
          print('open_pdks commit:', item)
          PY

      - name: Install SKY130 PDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PDK_ROOT"
          volare enable --pdk sky130 --pdk-root "$PDK_ROOT" "$OPEN_PDKS_REV"
          test -d "$PDK_ROOT/sky130A" || { echo 'SKY130A directory missing after Volare activation'; exit 1; }
          echo "SKY130A installed: $PDK_ROOT/sky130A"

      - name: Run SKY130 synthesis and physical flow
        shell: bash
        run: |
          set -o pipefail
          librelane --dockerized --pdk-root "$PDK_ROOT" physical/config.json 2>&1 | tee physical_flow.log

      - name: Collect run results
        if: always()
        shell: bash
        run: |
          mkdir -p physical_artifacts
          if [ -d physical/runs ]; then
            cp -r physical/runs physical_artifacts/
          fi
          if [ -f physical_flow.log ]; then
            cp physical_flow.log physical_artifacts/
          fi
          cp physical/config.json physical_artifacts/config.json
          echo 'Inspect physical_flow.log, metrics, reports, and final/.'

      - name: Upload physical reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silicluster-sky130-physical
          path: physical_artifacts/
          if-no-files-found: warn
          retention-days: 7
